<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LIFE QUEST</title>
    <!-- Preload LCP default wallpaper -->
    <link rel="preload" as="image" href="/backgrounds/rain.jpg" fetchpriority="high" />
    <!-- Google Fonts Preconnect & Display Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #090a0f;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }
      #app-shell-skeleton {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        background: radial-gradient(circle at 50% 20%, #151824 0%, #090a0f 80%);
        padding: 20px 16px;
        box-sizing: border-box;
      }
      .shell-header {
        width: 100%;
        max-width: 860px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 52px;
        margin-bottom: 28px;
      }
      .shell-logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .shell-logo-badge {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ba4949, #ea580c);
        box-shadow: 0 0 16px rgba(186, 73, 73, 0.4);
      }
      .shell-logo-text {
        width: 110px;
        height: 22px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
      }
      .shell-actions {
        display: flex;
        gap: 8px;
      }
      .shell-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
      }
      .shell-timer-card {
        width: 100%;
        max-width: 480px;
        background: rgba(18, 20, 29, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .shell-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 28px;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px;
        border-radius: 14px;
      }
      .shell-tab {
        width: 84px;
        height: 32px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
      }
      .shell-tab.active {
        background: rgba(186, 73, 73, 0.35);
      }
      .shell-clock {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 4px solid rgba(186, 73, 73, 0.25);
        box-shadow: 0 0 35px rgba(186, 73, 73, 0.15);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 28px;
        animation: shell-pulse 2s infinite ease-in-out;
      }
      @keyframes shell-pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .shell-time-text {
        width: 130px;
        height: 44px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.15);
        margin-bottom: 8px;
      }
      .shell-sub-text {
        width: 70px;
        height: 14px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
      }
      .shell-start-btn {
        width: 180px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(135deg, #ba4949, #a83d3d);
        box-shadow: 0 10px 25px rgba(186, 73, 73, 0.35);
      }
    </style>
    <script>
      (function() {
        if (window.location.pathname.startsWith('/admin')) {
          var style = document.createElement('style');
          style.innerHTML = '#app-shell-skeleton { display: none !important; } #admin-shell-skeleton { display: flex !important; }';
          document.head.appendChild(style);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Admin Portal Shell Skeleton (Prevents 0.217 CLS on /admin) -->
      <div id="admin-shell-skeleton" style="display: none; min-height: 100vh; background-color: #090d16; flex-direction: column;">
        <div style="height: 64px; background-color: #0e1424; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 36px; height: 36px; border-radius: 12px; background: rgba(245, 158, 11, 0.2);"></div>
            <div style="width: 150px; height: 18px; border-radius: 6px; background: rgba(255, 255, 255, 0.1);"></div>
          </div>
          <div style="width: 70px; height: 32px; border-radius: 10px; background: rgba(255, 255, 255, 0.08);"></div>
        </div>
        <div style="max-width: 1280px; width: 100%; margin: 0 auto; padding: 16px; box-sizing: border-box;">
          <div style="height: 52px; border-radius: 16px; background: #0f1523; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 24px;"></div>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
            <div style="min-height: 104px; border-radius: 16px; background: #111827; border: 1px solid rgba(255,255,255,0.06);"></div>
            <div style="min-height: 104px; border-radius: 16px; background: #111827; border: 1px solid rgba(255,255,255,0.06);"></div>
            <div style="min-height: 104px; border-radius: 16px; background: #111827; border: 1px solid rgba(255,255,255,0.06);"></div>
            <div style="min-height: 104px; border-radius: 16px; background: #111827; border: 1px solid rgba(255,255,255,0.06);"></div>
            <div style="min-height: 104px; border-radius: 16px; background: #111827; border: 1px solid rgba(255,255,255,0.06);"></div>
            <div style="min-height: 104px; border-radius: 16px; background: #111827; border: 1px solid rgba(255,255,255,0.06);"></div>
          </div>
        </div>
      </div>

      <!-- Main Focus Hub Shell Skeleton -->
      <div id="app-shell-skeleton">
        <div class="shell-header">
          <div class="shell-logo">
            <div class="shell-logo-badge"></div>
            <div class="shell-logo-text"></div>
          </div>
          <div class="shell-actions">
            <div class="shell-btn"></div>
            <div class="shell-btn"></div>
            <div class="shell-btn"></div>
          </div>
        </div>
        <div class="shell-timer-card">
          <div class="shell-tabs">
            <div class="shell-tab active"></div>
            <div class="shell-tab"></div>
            <div class="shell-tab"></div>
          </div>
          <div class="shell-clock">
            <div class="shell-time-text"></div>
            <div class="shell-sub-text"></div>
          </div>
          <div class="shell-start-btn"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
