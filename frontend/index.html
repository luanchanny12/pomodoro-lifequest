<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LIFE QUEST</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #090a0f;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }
      #app-shell-skeleton {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        background: radial-gradient(circle at 50% 20%, #151824 0%, #090a0f 80%);
        padding: 20px 16px;
        box-sizing: border-box;
      }
      .shell-header {
        width: 100%;
        max-width: 860px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 52px;
        margin-bottom: 28px;
      }
      .shell-logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .shell-logo-badge {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ba4949, #ea580c);
        box-shadow: 0 0 16px rgba(186, 73, 73, 0.4);
      }
      .shell-logo-text {
        width: 110px;
        height: 22px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
      }
      .shell-actions {
        display: flex;
        gap: 8px;
      }
      .shell-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
      }
      .shell-timer-card {
        width: 100%;
        max-width: 480px;
        background: rgba(18, 20, 29, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .shell-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 28px;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px;
        border-radius: 14px;
      }
      .shell-tab {
        width: 84px;
        height: 32px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
      }
      .shell-tab.active {
        background: rgba(186, 73, 73, 0.35);
      }
      .shell-clock {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 4px solid rgba(186, 73, 73, 0.25);
        box-shadow: 0 0 35px rgba(186, 73, 73, 0.15);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 28px;
        animation: shell-pulse 2s infinite ease-in-out;
      }
      @keyframes shell-pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .shell-time-text {
        width: 130px;
        height: 44px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.15);
        margin-bottom: 8px;
      }
      .shell-sub-text {
        width: 70px;
        height: 14px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
      }
      .shell-start-btn {
        width: 180px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(135deg, #ba4949, #a83d3d);
        box-shadow: 0 10px 25px rgba(186, 73, 73, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-shell-skeleton">
        <div class="shell-header">
          <div class="shell-logo">
            <div class="shell-logo-badge"></div>
            <div class="shell-logo-text"></div>
          </div>
          <div class="shell-actions">
            <div class="shell-btn"></div>
            <div class="shell-btn"></div>
            <div class="shell-btn"></div>
          </div>
        </div>
        <div class="shell-timer-card">
          <div class="shell-tabs">
            <div class="shell-tab active"></div>
            <div class="shell-tab"></div>
            <div class="shell-tab"></div>
          </div>
          <div class="shell-clock">
            <div class="shell-time-text"></div>
            <div class="shell-sub-text"></div>
          </div>
          <div class="shell-start-btn"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
