# Render Blueprint - deploy backend 24/7
# Cách dùng: Render Dashboard -> New + -> Blueprint -> chọn repo này.
# (Nếu tạo Web Service thủ công, chỉ cần đặt Root Directory = backend)
services:
  - type: web
    name: pomodoro-lifequest
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://pomodoro-lifequest.vercel.app,http://localhost:5173"
      - key: PINGER_SECRET_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PUBLIC_URL
        value: "https://pomodoro-lifequest.vercel.app"
