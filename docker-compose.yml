version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python -m pip install -r requirements.txt &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: npm run dev -- --host 0.0.0.0

  test:
    build: ./backend
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    command: sh -c "python -m pytest tests/ -v"

volumes:
  sqlite_data:
